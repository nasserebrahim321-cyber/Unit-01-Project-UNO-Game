<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script defer src="./app.js"></script>
    <title>Document</title>
</head>

<body>
    <main id="board">

        <!-- this is the opponent hand -->
        <div id="opponent-hand">
            <div class="card"></div>
        </div>

        <!-- this is the playing Board -->
        <div id="field">
            <div id="card-pool">card pool</div>
            <div id="deck">
            </div>
        </div>

        <!-- this is player hand -->
        <div id="player-hand">
            <div class="card">
            </div>
        </div>

        <!-- choose a color div-->
        <div id="choose-color">
            <div id="red"></div>
            <div id="blue"></div>
            <div id="yellow"></div>
            <div id="green"></div>
        </div>

    </main>
</body>

</html>
